[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zenkai-bot"
version = "0.1.0"
description = "A modular, Discord-native anime community bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20,<1",
    "apscheduler>=3.10,<4",
    "asyncpg>=0.29,<1",
    "discord.py>=2.4,<3",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "redis>=5,<6",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.6,<1",
]

[project.scripts]
zenkai = "zenkai.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["zenkai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
